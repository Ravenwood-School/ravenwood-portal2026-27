<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenwood Premium Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1100px; }
        th { background: #1e293b; color: white; padding: 12px; text-transform: uppercase; font-size: 11px; }
        td { border: 1px solid #e2e8f0; padding: 4px; text-align: center; background: white; }
        input { width: 100%; min-width: 60px; text-align: center; padding: 8px; font-weight: 600; color: #334155; }
        input:focus { outline: 2px solid #6366f1; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="dashboard-section" class="p-4 w-full">
        <div class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center">
            <h2 id="current-view-title" class="font-bold">Loading Workspace...</h2>
            <button onclick="exportProfessionalExcel()" class="bg-emerald-500 px-4 py-1 rounded text-xs font-bold">Export Excel</button>
        </div>
        <div class="table-container mt-4">
            <table id="marks-entry-table">
                <thead id="table-head-row"></thead>
                <tbody id="table-body-rows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5RV8tLsLZD6h1tsm_PxWnxrRZyylQY3k",
            authDomain: "ravenwood-exam-portal.firebaseapp.com",
            databaseURL: "https://ravenwood-exam-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ravenwood-exam-portal",
            storageBucket: "ravenwood-exam-portal.firebasestorage.app",
            messagingSenderId: "737654590264",
            appId: "1:737654590264:web:00b64a74917a93cd1b4fcd"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Configuration: Define path carefully
        let ActiveConfigStructure = { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20 };
        let DatabaseReferencePath = "student_records/X/WORDSWORTH"; 

        // SAFETY: Only run after document is fully ready
        document.addEventListener('DOMContentLoaded', () => {
            GenerateTableHeaders();
            SyncCloudDataLive();
        });

        function GenerateTableHeaders() {
            const thead = document.getElementById('table-head-row');
            if(!thead) return;
            let html = `<tr><th>Roll No</th><th>Name</th>`;
            ActiveConfigStructure.subjects.forEach(sub => html += `<th>${sub}</th>`);
            html += `<th>Total</th><th>Rank</th></tr>`;
            thead.innerHTML = html;
        }

        function SyncCloudDataLive() {
            database.ref(DatabaseReferencePath).on('value', (snap) => {
                const records = snap.val() || {};
                const tbody = document.getElementById('table-body-rows');
                if(!tbody) return;
                tbody.innerHTML = '';
                
                let list = Object.keys(records).map(id => ({ id, ...records[id] }));
                list.sort((a,b) => (Number(a.rollNo)||0) - (Number(b.rollNo)||0));
                
                list.forEach(s => {
                    let sum = ActiveConfigStructure.subjects.reduce((acc, sub) => sub !== 'Art' ? acc + (Number(s[sub]) || 0) : acc, 0);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><input type="number" value="${s.rollNo || ''}" onblur="database.ref('${DatabaseReferencePath}/${s.id}/rollNo').set(this.value)"></td>
                                    <td><input type="text" value="${s.name || ''}" onblur="database.ref('${DatabaseReferencePath}/${s.id}/name').set(this.value)"></td>
                                    ${ActiveConfigStructure.subjects.map(sub => `<td><input type="text" value="${s[sub] || ''}" onblur="database.ref('${DatabaseReferencePath}/${s.id}/${sub}').set(this.value.toUpperCase())"></td>`).join('')}
                                    <td class="font-bold">${sum}</td><td>-</td>`;
                    tbody.appendChild(tr);
                });
            });
        }
        
        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') {
                const inputs = Array.from(document.querySelectorAll('input'));
                const index = inputs.indexOf(e.target);
                if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); if (inputs[index + 10]) inputs[index + 10].focus(); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); if (inputs[index - 10]) inputs[index - 10].focus(); }
            }
        });
    </script>
</body>
</html>
