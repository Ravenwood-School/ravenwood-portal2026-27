<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenwood Premium Results Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .missing-mark { background-color: #fef2f2 !important; border: 2px solid #ef4444 !important; }
        
        /* Mobile Scroll Optimization for Table */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1100px; /* Forces scroll on mobile */ }
        
        th { background-color: #1e293b; color: #f8fafc; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; padding: 12px 8px; border: 1px solid #334155; white-space: nowrap; }
        td { border: 1px solid #e2e8f0; padding: 6px 4px; text-align: center; font-size: 14px; background-color: #fff; }
        tr:hover td { background-color: #f8fafc; }
        input { width: 100%; min-width: 60px; text-align: center; background: transparent; border: none; padding: 6px; font-weight: 500; color: #334155; }
        input:focus { outline: 2px solid #6366f1; background: #fff; border-radius: 6px; }
        .admin-tab-btn.active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: 700; }

        /* News Ticker Animation CSS */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #fef9c3; /* Light Yellow */
            border-top: 1px solid #fde047;
            border-bottom: 1px solid #fde047;
            padding: 6px 0;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
            font-weight: 700;
            color: #b45309; /* Dark Amber */
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-xl flex flex-col md:flex-row justify-between items-center px-4 md:px-8 py-4 border-b border-slate-800 gap-4">
        <div class="flex items-center gap-3">
            <img id="display-logo" src="https://via.placeholder.com/120?text=Logo" alt="School Logo" class="h-12 w-12 md:h-14 md:w-14 rounded-xl object-contain bg-white p-1 shadow-inner border border-slate-700">
            <div class="text-center md:text-left">
                <h1 id="app-school-name" class="text-lg md:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">RAVENWOOD INT. SCHOOL</h1>
                <p class="text-[10px] md:text-xs text-indigo-400 font-medium tracking-widest uppercase mt-0.5">Automated Cloud Exam Desk</p>
            </div>
        </div>
        <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
            <div id="connection-status" class="w-full md:w-auto text-center px-4 py-1.5 rounded-full text-xs font-bold shadow-sm bg-amber-500/10 text-amber-400 border border-amber-500/30">
                ⏳ Synchronizing...
            </div>
            <button id="logout-btn" class="hidden w-full md:w-auto bg-gradient-to-r from-rose-600 to-red-700 hover:from-rose-500 hover:to-red-600 px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all shadow-lg" onclick="logout()">Exit Portal</button>
        </div>
    </header>

    <main id="login-section" class="flex-grow flex justify-center items-center p-4 md:p-6 bg-gradient-to-b from-slate-900 to-slate-950 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="bg-white/95 backdrop-blur p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-200/50 relative z-10">
            <div class="text-center mb-6">
                <h2 class="text-2xl md:text-3xl font-black tracking-tight text-slate-800">Secure Gateway</h2>
            </div>
            
            <div class="mb-5">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-500">Authorization Scope:</label>
                <select id="role-select" class="w-full border border-slate-300 p-3 rounded-xl bg-slate-50 text-slate-700 font-medium" onchange="toggleLoginFields()">
                    <option value="teacher">Standard Faculty Entry</option>
                    <option value="admin">Central Administrator Desk</option>
                </select>
            </div>

            <div id="teacher-fields" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-slate-500">Target Class:</label>
                    <select id="class-select" class="w-full border border-slate-300 p-3 rounded-xl bg-slate-50 font-medium" onchange="updateSectionsDropdown()"><option value="">-- Choose Class --</option></select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-slate-500">Target Section:</label>
                    <select id="section-select" class="w-full border border-slate-300 p-3 rounded-xl bg-slate-50 font-medium"><option value="">-- Choose Section --</option></select>
                </div>
            </div>

            <div id="admin-fields" class="hidden mb-4">
                <label class="block text-xs font-bold uppercase mb-1 text-slate-500">Security Password Key:</label>
                <input type="password" id="admin-pass" placeholder="••••••••" class="w-full border border-slate-300 p-3 rounded-xl bg-slate-50 text-left tracking-widest">
            </div>

            <button onclick="login()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-700 hover:from-indigo-500 text-white font-bold py-3.5 rounded-xl mt-6 shadow-xl text-sm uppercase tracking-wider">Initialize Workspace</button>
        </div>
    </main>

    <main id="dashboard-section" class="hidden flex-grow p-2 md:p-6 w-full max-w-full space-y-6">
        
        <div id="admin-controls" class="hidden bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="border-b border-slate-200 bg-slate-50 px-2 md:px-6 py-2 flex flex-wrap gap-2 md:gap-6 overflow-x-auto">
                <button class="admin-tab-btn active py-3 text-xs md:text-sm font-semibold transition whitespace-nowrap" onclick="switchAdminTab('data-view')">👁️ Live Monitor</button>
                <button class="admin-tab-btn py-3 text-xs md:text-sm font-semibold transition whitespace-nowrap" onclick="switchAdminTab('structure-view')">🛠️ Structure Manager</button>
                <button class="admin-tab-btn py-3 text-xs md:text-sm font-semibold transition whitespace-nowrap" onclick="switchAdminTab('branding-view')">🎨 Design & Ticker</button>
            </div>

            <div id="admin-tab-data-view" class="p-4 md:p-6 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                    <div class="text-center md:text-left w-full md:w-auto">
                        <h4 class="font-bold text-indigo-950 text-base">Monitor Single Class Metrics</h4>
                    </div>
                    <div class="flex flex-wrap justify-center md:justify-end items-center gap-3 w-full md:w-auto">
                        <select id="admin-class-select" class="border border-slate-300 p-2 rounded-xl bg-white font-semibold text-sm w-full md:w-auto" onchange="updateAdminSections()"></select>
                        <select id="admin-section-select" class="border border-slate-300 p-2 rounded-xl bg-white font-semibold text-sm w-full md:w-auto"></select>
                        <button class="w-full md:w-auto bg-indigo-600 text-white px-5 py-2 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-indigo-700" onclick="loadAdminSelectedClass()">Load Data</button>
                    </div>
                </div>
            </div>

            <div id="admin-tab-structure-view" class="hidden p-4 md:p-6 space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="border border-slate-200 p-4 md:p-5 rounded-2xl bg-slate-50/50 space-y-3">
                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wide border-b pb-2">Add New Class</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="new-class-name" placeholder="Class Name (e.g. XI)" class="bg-white border p-2 rounded-xl text-left font-semibold">
                            <input type="number" id="new-class-max" placeholder="Max Marks" class="bg-white border p-2 rounded-xl text-left font-semibold">
                        </div>
                        <input type="text" id="new-class-subjects" placeholder="Subjects (Comma separated)" class="w-full bg-white border p-2 rounded-xl text-left text-xs">
                        <input type="text" id="new-class-sections" placeholder="Sections (Comma separated)" class="w-full bg-white border p-2 rounded-xl text-left text-xs">
                        <button class="bg-slate-900 text-white w-full py-2.5 rounded-xl font-bold text-xs uppercase" onclick="saveNewClassStructure()">Save Class</button>
                    </div>
                    <div class="border border-slate-200 p-4 md:p-5 rounded-2xl bg-slate-50/50 space-y-2">
                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wide border-b pb-2">Active Classes</h4>
                        <div id="active-structures-list" class="text-xs space-y-2 max-h-48 overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </div>

            <div id="admin-tab-branding-view" class="hidden p-4 md:p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                    <div class="border border-slate-200 p-4 md:p-5 rounded-2xl bg-slate-50/50 space-y-3">
                        <label class="text-xs font-bold text-slate-800 uppercase tracking-wider block">Upload School Logo:</label>
                        <p class="text-xs text-slate-500 mb-2">Select a PNG/JPG. This appears on portal and Excel prints.</p>
                        <input type="file" id="logo-file-input" accept="image/png, image/jpeg" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-semibold file:bg-indigo-50 file:text-indigo-700" onchange="handleLogoUpload(event)">
                    </div>
                    
                    <div class="space-y-4">
                        <div class="border border-slate-200 p-4 rounded-2xl bg-slate-50/50 space-y-2">
                            <label class="text-xs font-bold text-slate-800 uppercase block">Excel Print Heading Text:</label>
                            <input type="text" id="excel-heading-input" value="PT 1 Exam Result of Class _________ for Academic Session 2026-27" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm bg-white font-medium" onblur="saveAdminConfig('excelHeading', this.value)">
                        </div>
                        
                        <div class="border border-slate-200 p-4 rounded-2xl bg-slate-50/50 space-y-2">
                            <label class="text-xs font-bold text-amber-700 uppercase block">Moving Headline Ticker Text (News Style):</label>
                            <input type="text" id="ticker-heading-input" value="🔥 PT 1 Exam Result of Class _________ for Academic Session 2026-27 (May) has been declared! 🔥" class="w-full border border-amber-300 p-2.5 rounded-xl text-sm bg-white font-medium focus:ring-amber-500 focus:border-amber-500" onblur="saveAdminConfig('tickerText', this.value)">
                            <p class="text-[10px] text-slate-500">Note: Use _________ to automatically insert Class Name.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden w-full">
            
            <div class="ticker-wrap hidden" id="ticker-container">
                <div class="ticker" id="live-ticker-text">
                    </div>
            </div>

            <div class="bg-slate-900 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-slate-800">
                <div class="text-center md:text-left">
                    <h2 id="current-view-title" class="text-lg md:text-xl font-black text-white tracking-wide">Workspace Ready</h2>
                    <p class="text-[10px] md:text-xs text-emerald-400 font-semibold mt-0.5 flex items-center justify-center md:justify-start gap-1">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Auto-Saving Active
                    </p>
                </div>
                <div class="flex flex-row justify-center w-full md:w-auto gap-2 md:gap-3">
                    <button class="bg-indigo-600 text-white px-3 md:px-5 py-2 md:py-2.5 rounded-xl font-bold hover:bg-indigo-700 text-[10px] md:text-xs flex items-center gap-1 md:gap-2 uppercase shadow-lg w-1/2 md:w-auto justify-center" onclick="addNewStudentRow()">
                        <span>+</span> Add Row
                    </button>
                    <button class="bg-emerald-500 text-white px-3 md:px-5 py-2 md:py-2.5 rounded-xl font-bold hover:bg-emerald-600 text-[10px] md:text-xs flex items-center gap-1 md:gap-2 uppercase shadow-lg w-1/2 md:w-auto justify-center" onclick="exportProfessionalExcel()">
                        <span>📥</span> Export Excel
                    </button>
                </div>
            </div>
            
            <div class="table-container p-2 md:p-6 bg-slate-50/50">
                <table id="marks-entry-table" class="shadow-sm rounded-xl overflow-hidden border border-slate-200">
                    <thead id="table-head-row"></thead>
                    <tbody id="table-body-rows"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyB5RV8tLsLZD6h1tsm_PxWnxrRZyylQY3k",
            authDomain: "ravenwood-exam-portal.firebaseapp.com",
            databaseURL: "https://ravenwood-exam-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ravenwood-exam-portal",
            storageBucket: "ravenwood-exam-portal.firebasestorage.app",
            messagingSenderId: "737654590264",
            appId: "1:737654590264:web:00b64a74917a93cd1b4fcd"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let dynamicAcademicStructure = {};
        let ActiveUserRole = "teacher";
        let SelectedClassKey = "";
        let SelectedSectionKey = "";
        let DatabaseReferencePath = "";
        let ActiveConfigStructure = null;
        let globalSchoolLogoBase64 = null; 
        
        // Ticker and Heading Global Variables
        let globalExcelHeading = "PT 1 Exam Result of Class _________ for Academic Session 2026-27 (May)";
        let globalTickerText = "🔥 PT 1 Exam Result of Class _________ for Academic Session 2026-27 (May) has been declared! 🔥";

        // Connection Status
        database.ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById('connection-status');
            if (snap.val() === true) {
                statusEl.className = "w-full md:w-auto text-center px-4 py-1.5 rounded-full text-xs font-bold shadow-sm bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                statusEl.innerText = "⚡ Connected";
            } else {
                statusEl.className = "w-full md:w-auto text-center px-4 py-1.5 rounded-full text-xs font-bold shadow-sm bg-rose-500/10 text-rose-400 border border-rose-500/20";
                statusEl.innerText = "🛑 Offline";
            }
        });

        // Load Global Configs
        database.ref('portal_config').on('value', (snap) => {
            let conf = snap.val();
            if(conf && conf.academicStructure) dynamicAcademicStructure = conf.academicStructure;
            
            if(conf) {
                if(conf.excelHeading) {
                    globalExcelHeading = conf.excelHeading;
                    document.getElementById('excel-heading-input').value = conf.excelHeading;
                }
                if(conf.tickerText) {
                    globalTickerText = conf.tickerText;
                    document.getElementById('ticker-heading-input').value = conf.tickerText;
                }
                if(conf.logoBase64) {
                    globalSchoolLogoBase64 = conf.logoBase64;
                    document.getElementById('display-logo').src = conf.logoBase64;
                }
            }
            populateDropdowns();
            renderActiveStructures();
            
            // If already loaded a class, refresh the ticker
            if(SelectedClassKey && SelectedSectionKey) updateTickerText();
        });

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    database.ref('portal_config/logoBase64').set(e.target.result).then(() => {
                        alert("Logo saved successfully!");
                    }).catch(() => alert("Image is too large for database. Try a smaller compression."));
                };
                reader.readAsDataURL(file);
            }
        }

        function saveAdminConfig(key, value) {
            database.ref(`portal_config/${key}`).set(value);
        }

        function populateDropdowns() {
            const classDropdown = document.getElementById('class-select');
            const adminClassDropdown = document.getElementById('admin-class-select');
            let currentTeacherClass = classDropdown.value;
            let currentAdminClass = adminClassDropdown.value;

            classDropdown.innerHTML = '<option value="">-- Choose Class --</option>';
            adminClassDropdown.innerHTML = '';
            
            Object.keys(dynamicAcademicStructure).forEach(cls => {
                let opt = document.createElement('option');
                opt.value = cls; opt.innerText = `Class ${cls}`;
                classDropdown.appendChild(opt.cloneNode(true));
                adminClassDropdown.appendChild(opt);
            });
            if(currentTeacherClass) classDropdown.value = currentTeacherClass;
            if(currentAdminClass) adminClassDropdown.value = currentAdminClass;
            updateAdminSections();
        }

        function updateSectionsDropdown() {
            const cls = document.getElementById('class-select').value;
            const secDropdown = document.getElementById('section-select');
            secDropdown.innerHTML = '<option value="">-- Choose Section --</option>';
            if(cls && dynamicAcademicStructure[cls]) {
                dynamicAcademicStructure[cls].sections.forEach(sec => {
                    let opt = document.createElement('option');
                    opt.value = sec; opt.innerText = sec;
                    secDropdown.appendChild(opt);
                });
            }
        }

        function updateAdminSections() {
            const cls = document.getElementById('admin-class-select').value;
            const secDropdown = document.getElementById('admin-section-select');
            secDropdown.innerHTML = '';
            if(cls && dynamicAcademicStructure[cls]) {
                dynamicAcademicStructure[cls].sections.forEach(sec => {
                    let opt = document.createElement('option');
                    opt.value = sec; opt.innerText = sec;
                    secDropdown.appendChild(opt);
                });
            }
        }

        function toggleLoginFields() {
            const role = document.getElementById('role-select').value;
            if(role === 'admin') {
                document.getElementById('teacher-fields').classList.add('hidden');
                document.getElementById('admin-fields').classList.remove('hidden');
            } else {
                document.getElementById('admin-fields').classList.add('hidden');
                document.getElementById('teacher-fields').classList.remove('hidden');
            }
        }

        function switchAdminTab(tabId) {
            document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('admin-tab-data-view').classList.add('hidden');
            document.getElementById('admin-tab-structure-view').classList.add('hidden');
            document.getElementById('admin-tab-branding-view').classList.add('hidden');
            document.getElementById(`admin-tab-${tabId}`).classList.remove('hidden');
        }

        function login() {
            const role = document.getElementById('role-select').value;
            if(role === 'admin') {
                if(document.getElementById('admin-pass').value === '1234') {
                    ActiveUserRole = 'admin';
                    document.getElementById('admin-controls').classList.remove('hidden');
                    let defaultClass = Object.keys(dynamicAcademicStructure)[0];
                    let defaultSec = dynamicAcademicStructure[defaultClass]?.sections?.[0];
                    if(defaultClass && defaultSec) InitializeWorkspace(defaultClass, defaultSec);
                } else {
                    alert('Invalid Admin Password!'); return;
                }
            } else {
                const cls = document.getElementById('class-select').value;
                const sec = document.getElementById('section-select').value;
                if(!cls || !sec) { alert('Please choose Class and Section.'); return; }
                ActiveUserRole = 'teacher';
                document.getElementById('admin-controls').classList.add('hidden');
                InitializeWorkspace(cls, sec);
            }
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
        }

        function logout() { location.reload(); }

        function loadAdminSelectedClass() {
            const cls = document.getElementById('admin-class-select').value;
            const sec = document.getElementById('admin-section-select').value;
            if(cls && sec) InitializeWorkspace(cls, sec);
        }

        function saveNewClassStructure() {
            const clsName = document.getElementById('new-class-name').value.trim().toUpperCase();
            const maxMarks = Number(document.getElementById('new-class-max').value);
            const subs = document.getElementById('new-class-subjects').value.split(',').map(s => s.trim());
            const secs = document.getElementById('new-class-sections').value.split(',').map(s => s.trim().toUpperCase());

            if(!clsName || !maxMarks || subs.length === 0 || secs.length === 0) { alert("Missing fields!"); return; }

            dynamicAcademicStructure[clsName] = { subjects: subs, max: maxMarks, sections: secs };
            database.ref('portal_config/academicStructure').set(dynamicAcademicStructure);
            document.getElementById('new-class-name').value = '';
            document.getElementById('new-class-max').value = '';
        }

        function deleteClassStructure(cls) {
            if(confirm(`Delete Class ${cls}?`)) {
                delete dynamicAcademicStructure[cls];
                database.ref('portal_config/academicStructure').set(dynamicAcademicStructure);
            }
        }

        function renderActiveStructures() {
            const container = document.getElementById('active-structures-list');
            container.innerHTML = '';
            Object.keys(dynamicAcademicStructure).forEach(cls => {
                let div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white p-2.5 rounded-xl border mb-1.5";
                div.innerHTML = `<div><b>Class ${cls}</b> | Max: ${dynamicAcademicStructure[cls].max}</div>
                <button class="text-rose-600 font-bold px-2" onclick="deleteClassStructure('${cls}')">Delete</button>`;
                container.appendChild(div);
            });
        }

        function updateTickerText() {
            const tickerContainer = document.getElementById('ticker-container');
            const tickerText = document.getElementById('live-ticker-text');
            tickerContainer.classList.remove('hidden');
            
            // Replace placeholder with actual class name
            const finalHeadline = globalTickerText.replace('_________', `${SelectedClassKey}-${SelectedSectionKey}`);
            
            // Add extra spaces to make looping look continuous
            tickerText.innerHTML = `${finalHeadline} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${finalHeadline} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${finalHeadline}`;
        }

        function InitializeWorkspace(cls, sec) {
            SelectedClassKey = cls;
            SelectedSectionKey = sec;
            ActiveConfigStructure = dynamicAcademicStructure[cls];
            DatabaseReferencePath = `student_records/${cls}/${sec}`;
            document.getElementById('current-view-title').innerText = `Class Workspace: ${cls} - ${sec}`;
            
            updateTickerText(); // Activate Moving Headline
            GenerateTableHeaders();
            SyncCloudDataLive();
        }

        function GenerateTableHeaders() {
            const thead = document.getElementById('table-head-row');
            if(!ActiveConfigStructure) return;
            let html = `<tr>
                <th style="min-width: 80px;">Roll No</th>
                <th style="min-width: 200px; text-align: left;">Student Name</th>`;
            ActiveConfigStructure.subjects.forEach(sub => {
                html += `<th style="min-width: 90px;">${sub} <br><span class="text-[9px]">Max: ${ActiveConfigStructure.max}</span></th>`;
            });
            html += `
                <th class="bg-indigo-950 text-white" style="min-width: 80px;">Total</th>
                <th class="bg-indigo-950 text-white" style="min-width: 80px;">%age</th>
                <th class="bg-amber-500 text-slate-900" style="min-width: 80px;">Rank</th>`;
            if(ActiveUserRole === 'admin') html += `<th class="bg-rose-900 text-white" style="min-width: 80px;">Action</th>`;
            html += `</tr>`;
            thead.innerHTML = html;
        }

        function SyncCloudDataLive() {
            database.ref(DatabaseReferencePath).off();
            database.ref(DatabaseReferencePath).on('value', (snapshot) => {
                const records = snapshot.val() || {};
                RenderDataMatrix(records);
            });
        }

        function RenderDataMatrix(records) {
            const tbody = document.getElementById('table-body-rows');
            tbody.innerHTML = '';
            if(!ActiveConfigStructure) return;
            
            let studentsList = Object.keys(records).map(id => ({ id: id, ...records[id] }));
            studentsList.forEach(student => {
                let sum = 0;
                ActiveConfigStructure.subjects.forEach(sub => {
                    if(sub.toLowerCase() !== 'art' && student[sub]) sum += Number(student[sub]);
                });
                student.calculatedTotal = sum;
            });
            studentsList.sort((a, b) => b.calculatedTotal - a.calculatedTotal);

            studentsList.forEach((student, index) => {
                const tr = document.createElement('tr');
                let rowHtml = `
                    <td class="${!student.rollNo ? 'missing-mark':''}"><input type="number" value="${student.rollNo || ''}" onblur="commitCellChange('${student.id}', 'rollNo', this.value)" oninput="evaluateHighlight(this)"></td>
                    <td class="${!student.name ? 'missing-mark':''}"><input type="text" style="text-align: left;" value="${student.name || ''}" onblur="commitCellChange('${student.id}', 'name', this.value)" oninput="evaluateHighlight(this)"></td>
                `;

                ActiveConfigStructure.subjects.forEach(sub => {
                    let markVal = student[sub] !== undefined ? student[sub] : '';
                    let inpType = (sub.toLowerCase() === 'art') ? 'text' : 'number';
                    rowHtml += `<td class="${markVal==='' ? 'missing-mark':''}"><input type="${inpType}" value="${markVal}" oninput="evaluateHighlight(this);" onblur="commitCellChange('${student.id}', '${sub}', this.value)"></td>`;
                });

                const max = ActiveConfigStructure.subjects.filter(s => s.toLowerCase() !== 'art').length * ActiveConfigStructure.max;
                const perc = max > 0 ? ((student.calculatedTotal / max) * 100).toFixed(1) + '%' : '0%';

                rowHtml += `
                    <td class="font-bold text-indigo-900 bg-indigo-50">${student.calculatedTotal}</td>
                    <td class="font-semibold text-indigo-900 bg-indigo-50">${perc}</td>
                    <td class="font-black text-amber-700 bg-amber-50">${student.calculatedTotal > 0 ? index + 1 : '-'}</td>
                `;

                if(ActiveUserRole === 'admin') {
                    rowHtml += `<td><button class="text-rose-600 text-xs font-bold" onclick="purgeRecord('${student.id}')">Delete</button></td>`;
                }
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function evaluateHighlight(el) { el.parentElement.classList.toggle('missing-mark', el.value.trim() === ""); }
        function commitCellChange(id, field, val) { database.ref(`${DatabaseReferencePath}/${id}/${field}`).set(val); }
        function addNewStudentRow() {
            if(!ActiveConfigStructure) return;
            let payload = { rollNo: "", name: "" };
            ActiveConfigStructure.subjects.forEach(sub => payload[sub] = "");
            database.ref(DatabaseReferencePath).push().set(payload);
        }
        function purgeRecord(id) { if(confirm("Delete permanently?")) database.ref(`${DatabaseReferencePath}/${id}`).remove(); }

        // EXCEL EXPORT ENGINE
        async function exportProfessionalExcel() {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet(`Class ${SelectedClassKey}-${SelectedSectionKey}`);

            const table = document.getElementById('marks-entry-table');
            const htmlHeaders = Array.from(table.querySelectorAll("th")).map(th => th.innerText.split('\n')[0].trim());
            if(ActiveUserRole === 'admin') htmlHeaders.pop(); 

            const totalCols = htmlHeaders.length;

            let cols = [{ width: 12 }, { width: 35 }]; 
            for(let i = 2; i < totalCols; i++) cols.push({ width: 15 });
            sheet.columns = cols;

            if (globalSchoolLogoBase64) {
                const extensionMatch = globalSchoolLogoBase64.match(/^data:image\/(png|jpeg|jpg);base64,/);
                const ext = extensionMatch ? extensionMatch[1] : 'png';
                const imageId = workbook.addImage({ base64: globalSchoolLogoBase64, extension: ext });
                sheet.addImage(imageId, { tl: { col: 0, row: 0 }, ext: { width: 100, height: 100 } });
            }

            sheet.mergeCells(1, 2, 1, totalCols); 
            const titleCell = sheet.getCell(1, 2);
            titleCell.value = "RAVENWOOD INTERNATIONAL SCHOOL";
            titleCell.font = { name: 'Arial', size: 18, bold: true, color: { argb: 'FF1E293B' } };
            titleCell.alignment = { vertical: 'middle', horizontal: 'center' };

            sheet.mergeCells(2, 2, 2, totalCols);
            const subHeadingText = globalExcelHeading.replace('_________', `Class ${SelectedClassKey}-${SelectedSectionKey}`);
            const subCell = sheet.getCell(2, 2);
            subCell.value = subHeadingText;
            subCell.font = { name: 'Arial', size: 14, bold: true, color: { argb: 'FF334155' } };
            subCell.alignment = { vertical: 'middle', horizontal: 'center' };

            sheet.mergeCells(3, 2, 3, totalCols);
            const detailCell = sheet.getCell(3, 2);
            detailCell.value = "Generated Automatically via Ravenwood Portal";
            detailCell.font = { name: 'Arial', size: 10, italic: true, color: { argb: 'FF64748B' } };
            detailCell.alignment = { vertical: 'middle', horizontal: 'center' };

            sheet.getRow(1).height = 30;
            sheet.getRow(2).height = 25;
            sheet.getRow(3).height = 20;
            sheet.getRow(4).height = 15;

            const headerRow = sheet.getRow(5);
            headerRow.values = htmlHeaders;
            headerRow.height = 25;
            
            headerRow.eachCell((cell, colNumber) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true, size: 12 };
                cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
            });

            const rows = Array.from(table.querySelectorAll("tbody tr"));
            let currentRowNum = 6;

            rows.forEach(row => {
                const rowData = [];
                row.querySelectorAll("input").forEach(inp => rowData.push(inp.value));
                const tds = row.querySelectorAll("td");
                let offset = (ActiveUserRole === 'admin') ? 1 : 0;
                rowData.push(tds[tds.length - 3 - offset].innerText); 
                rowData.push(tds[tds.length - 2 - offset].innerText); 
                rowData.push(tds[tds.length - 1 - offset].innerText); 

                const dataRow = sheet.getRow(currentRowNum);
                dataRow.values = rowData;
                
                dataRow.eachCell((cell, colNum) => {
                    cell.alignment = { vertical: 'middle', horizontal: colNum === 2 ? 'left' : 'center' };
                    cell.border = { top: {style:'thin', color: {argb:'FFE2E8F0'}}, left: {style:'thin', color: {argb:'FFE2E8F0'}}, bottom: {style:'thin', color: {argb:'FFE2E8F0'}}, right: {style:'thin', color: {argb:'FFE2E8F0'}} };
                    
                    if (colNum >= totalCols - 2) {
                        cell.font = { bold: true, color: { argb: 'FF1E3A8A' } };
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0Fdf4' } }; 
                    }
                });
                currentRowNum++;
            });

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Class_${SelectedClassKey}_${SelectedSectionKey}_Designed_Report.xlsx`);
        }
    </script>
