<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenwood Results Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1100px; }
        th { background: #1e293b; color: white; padding: 12px; text-transform: uppercase; font-size: 11px; }
        td { border: 1px solid #e2e8f0; padding: 4px; text-align: center; background: white; }
        input { width: 100%; min-width: 60px; text-align: center; padding: 8px; font-weight: 600; color: #334155; background: transparent; border: none; }
        input:focus { outline: 2px solid #6366f1; background: #fff; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="login-section" class="p-8 flex justify-center">
        <div class="bg-white p-6 rounded-xl shadow border w-full max-w-sm">
            <h2 class="text-lg font-bold mb-4">Select Class</h2>
            <select id="class-select" class="w-full border p-2 mb-3 rounded" onchange="updateSections()"><option value="">-- Class --</option></select>
            <select id="section-select" class="w-full border p-2 mb-3 rounded"><option value="">-- Section --</option></select>
            <button onclick="enterDashboard()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">Open Workspace</button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden p-4 w-full">
        <div class="bg-slate-900 text-white p-4 rounded-xl flex justify-between">
            <h2 id="current-view-title" class="font-bold">Workspace Ready</h2>
            <button onclick="exportProfessionalExcel()" class="bg-emerald-500 px-4 py-1 rounded text-xs font-bold">Export Excel</button>
        </div>
        <div class="table-container mt-4">
            <table id="marks-entry-table">
                <thead id="table-head-row"></thead>
                <tbody id="table-body-rows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5RV8tLsLZD6h1tsm_PxWnxrRZyylQY3k",
            authDomain: "ravenwood-exam-portal.firebaseapp.com",
            databaseURL: "https://ravenwood-exam-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ravenwood-exam-portal",
            storageBucket: "ravenwood-exam-portal.firebasestorage.app",
            messagingSenderId: "737654590264",
            appId: "1:737654590264:web:00b64a74917a93cd1b4fcd"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ACADEMIC STRUCTURE (All Classes)
        const academicStructure = {
            "I": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["DAFFODILS", "DAISY", "ORCHID", "TULIP"] },
            "II": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["EARTH", "JUPITER", "MARS", "NEPTUNE", "VENUS"] },
            "III": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["AMAZON", "BEAS", "INDUS", "NILE", "THAMES"] },
            "IV": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["ARCTIC", "ATLANTIC", "PACIFIC"] },
            "V": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["MT. ALPS", "MT. BLANC", "MT. ELBERT", "MT. EVEREST"] },
            "VI": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["DARWIN", "EINSTEIN", "NEWTON"] },
            "VII": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["DIAMOND", "EMERALD", "PEARL"] },
            "VIII": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["FLAMINGO", "HORNBILL", "JAY"] },
            "IX": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["LEONARDO", "PICASSO", "SALVADOR"] },
            "X": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 40, sections: ["WORDSWORTH"] }
        };

        let ActiveConfig = null, DatabasePath = "";

        // Init Dropdowns
        const clsSelect = document.getElementById('class-select');
        Object.keys(academicStructure).forEach(c => {
            let opt = document.createElement('option'); opt.value = c; opt.innerText = `Class ${c}`;
            clsSelect.appendChild(opt);
        });

        function updateSections() {
            const cls = clsSelect.value;
            const secSelect = document.getElementById('section-select');
            secSelect.innerHTML = '<option value="">-- Section --</option>';
            if(cls && academicStructure[cls]) {
                academicStructure[cls].sections.forEach(s => {
                    let opt = document.createElement('option'); opt.value = s; opt.innerText = s;
                    secSelect.appendChild(opt);
                });
            }
        }

        function enterDashboard() {
            const cls = clsSelect.value;
            const sec = document.getElementById('section-select').value;
            if(!cls || !sec) { alert("Select Class & Section"); return; }
            
            ActiveConfig = academicStructure[cls];
            DatabasePath = `student_records/${cls}/${sec}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('current-view-title').innerText = `Workspace: ${cls} - ${sec}`;
            initTable();
        }

        function initTable() {
            const thead = document.getElementById('table-head-row');
            thead.innerHTML = `<tr><th>Roll No</th><th>Name</th>${ActiveConfig.subjects.map(s => `<th>${s}</th>`).join('')}<th>Total</th><th>Rank</th></tr>`;
            
            database.ref(DatabasePath).on('value', snap => {
                const tbody = document.getElementById('table-body-rows');
                tbody.innerHTML = '';
                const data = snap.val() || {};
                let list = Object.keys(data).map(id => ({id, ...data[id]}));
                
                list.sort((a,b) => (Number(a.rollNo)||0) - (Number(b.rollNo)||0));
                
                list.forEach(s => {
                    let total = ActiveConfig.subjects.reduce((a, sub) => sub !== 'Art' ? a + (Number(s[sub])||0) : a, 0);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><input type="number" value="${s.rollNo||''}" onblur="database.ref('${DatabasePath}/${s.id}/rollNo').set(this.value)"></td>
                                    <td><input type="text" value="${s.name||''}" onblur="database.ref('${DatabasePath}/${s.id}/name').set(this.value)"></td>
                                    ${ActiveConfig.subjects.map(sub => `<td><input type="text" class="${sub==='Art'?'grade-input':''}" value="${s[sub]||''}" onblur="database.ref('${DatabasePath}/${s.id}/${sub}').set(this.value.toUpperCase())"></td>`).join('')}
                                    <td class="font-bold bg-slate-100">${total}</td><td>-</td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        // Keyboard Nav (Kept exactly same)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') {
                const inputs = Array.from(document.querySelectorAll('input'));
                const i = inputs.indexOf(e.target);
                const cols = ActiveConfig.subjects.length + 2;
                if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); if (inputs[i+cols]) inputs[i+cols].focus(); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); if (inputs[i-cols]) inputs[i-cols].focus(); }
            }
        });
        
        function exportProfessionalExcel() { alert("Exporting..."); }
    </script>
</body>
</html>
