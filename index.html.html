<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenwood Results Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        .missing-mark { background-color: #fee2e2 !important; border: 2px solid #ef4444 !important; }
        table { border-collapse: collapse; width: 100%; min-width: 1000px; }
        th, td { border: 1px solid #d1d5db; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #f3f4f6; color: #1f2937; font-weight: 600; }
        input { width: 100%; text-align: center; background: transparent; border: none; padding: 6px; font-weight: 600; }
        input:focus { outline: 2px solid #3b82f6; background: #fff; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-950 text-white p-4 shadow-lg flex justify-between items-center px-8">
        <div class="flex items-center gap-4">
            <img src="https://via.placeholder.com/60" alt="Logo" class="h-10 w-10 rounded-full bg-white p-1">
            <h1 class="text-xl font-bold">RAVENWOOD INTERNATIONAL SCHOOL</h1>
        </div>
        <button id="logout-btn" class="hidden bg-rose-600 px-4 py-1.5 rounded text-sm font-bold" onclick="logout()">Logout</button>
    </header>

    <main id="login-section" class="flex-grow flex justify-center items-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm border">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">Login Portal</h2>
            <select id="role-select" class="w-full border p-2 mb-3 rounded" onchange="toggleLoginFields()">
                <option value="teacher">Teacher Entry</option>
                <option value="admin">Administrator</option>
            </select>
            <div id="teacher-fields">
                <select id="class-select" class="w-full border p-2 mb-3 rounded" onchange="updateSectionsDropdown()"><option value="">-- Class --</option></select>
                <select id="section-select" class="w-full border p-2 mb-3 rounded"><option value="">-- Section --</option></select>
            </div>
            <input type="password" id="admin-pass" placeholder="Admin Password" class="hidden w-full border p-2 mb-3 rounded">
            <button onclick="login()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">Login</button>
        </div>
    </main>

    <main id="dashboard-section" class="hidden flex-grow p-6 w-full">
        <div class="bg-white p-4 rounded-lg shadow border flex justify-between items-center mb-4">
            <h2 id="current-view-title" class="font-bold">Workspace</h2>
            <div class="flex gap-2">
                <button onclick="addNewStudentRow()" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm">+ Row</button>
                <button onclick="exportExcel()" class="bg-emerald-600 text-white px-3 py-1 rounded text-sm">Export</button>
            </div>
        </div>
        <div class="overflow-x-auto bg-white p-4 rounded shadow border">
            <table id="marks-entry-table">
                <thead id="table-head-row"></thead>
                <tbody id="table-body-rows"></tbody>
            </table>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5RV8tLsLZD6h1tsm_PxWnxrRZyylQY3k",
            authDomain: "ravenwood-exam-portal.firebaseapp.com",
            databaseURL: "https://ravenwood-exam-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ravenwood-exam-portal",
            storageBucket: "ravenwood-exam-portal.firebasestorage.app",
            messagingSenderId: "737654590264",
            appId: "1:737654590264:web:00b64a74917a93cd1b4fcd"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const academicStructure = {
            "I": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["DAFFODILS", "DAISY", "ORCHID", "TULIP"] },
            "II": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["EARTH", "JUPITER", "MARS", "NEPTUNE", "VENUS"] },
            "III": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["AMAZON", "BEAS", "INDUS", "NILE", "THAMES"] },
            "IV": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["ARCTIC", "ATLANTIC", "PACIFIC"] },
            "V": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["MT. ALPS", "MT. BLANC", "MT. ELBERT", "MT. EVEREST"] },
            "VI": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["DARWIN", "EINSTEIN", "NEWTON"] },
            "VII": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["DIAMOND", "EMERALD", "PEARL"] },
            "VIII": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["FLAMINGO", "HORNBILL", "JAY"] },
            "IX": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["LEONARDO", "PICASSO", "SALVADOR"] },
            "X": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 40, sections: ["WORDSWORTH"] }
        };

        let ActiveConfigStructure = null, DatabasePath = "";

        // UI Helpers
        function toggleLoginFields() {
            const role = document.getElementById('role-select').value;
            document.getElementById('teacher-fields').classList.toggle('hidden', role === 'admin');
            document.getElementById('admin-pass').classList.toggle('hidden', role === 'teacher');
        }

        function populateDropdowns() {
            const clsSelect = document.getElementById('class-select');
            Object.keys(academicStructure).forEach(cls => {
                let opt = document.createElement('option'); opt.value = cls; opt.innerText = `Class ${cls}`;
                clsSelect.appendChild(opt);
            });
        }
        
        function updateSectionsDropdown() {
            const cls = document.getElementById('class-select').value;
            const secSelect = document.getElementById('section-select');
            secSelect.innerHTML = '<option value="">-- Section --</option>';
            if(cls && academicStructure[cls]) {
                academicStructure[cls].sections.forEach(sec => {
                    let opt = document.createElement('option'); opt.value = sec; opt.innerText = sec;
                    secSelect.appendChild(opt);
                });
            }
        }

        populateDropdowns();

        function login() {
            const cls = document.getElementById('class-select').value;
            const sec = document.getElementById('section-select').value;
            if(!cls || !sec) { alert("Please select Class/Section"); return; }
            
            ActiveConfigStructure = academicStructure[cls];
            DatabasePath = `student_records/${cls}/${sec}`;
            document.getElementById('current-view-title').innerText = `Workspace: ${cls} - ${sec}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            initTable();
        }

        function initTable() {
            // Header
            const thead = document.getElementById('table-head-row');
            thead.innerHTML = `<tr><th>Roll No</th><th>Name</th>${ActiveConfigStructure.subjects.map(s => `<th>${s}</th>`).join('')}<th>Total</th><th>Rank</th></tr>`;
            
            database.ref(DatabasePath).on('value', snap => {
                const tbody = document.getElementById('table-body-rows');
                tbody.innerHTML = '';
                const data = snap.val() || {};
                let list = Object.keys(data).map(id => ({id, ...data[id]}));
                
                // Sort by roll
                list.sort((a,b) => (Number(a.rollNo)||0) - (Number(b.rollNo)||0));
                
                list.forEach(s => {
                    let total = ActiveConfigStructure.subjects.reduce((a, sub) => sub !== 'Art' ? a + (Number(s[sub])||0) : a, 0);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><input type="number" value="${s.rollNo||''}" onblur="database.ref('${DatabasePath}/${s.id}/rollNo').set(this.value)"></td>
                                    <td><input type="text" value="${s.name||''}" onblur="database.ref('${DatabasePath}/${s.id}/name').set(this.value)"></td>
                                    ${ActiveConfigStructure.subjects.map(sub => `<td><input type="text" value="${s[sub]||''}" onblur="database.ref('${DatabasePath}/${s.id}/${sub}').set(this.value.toUpperCase())"></td>`).join('')}
                                    <td class="font-bold bg-slate-100">${total}</td><td>-</td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        function addNewStudentRow() { database.ref(DatabasePath).push().set({rollNo:"", name:""}); }
        function logout() { location.reload(); }

        // Keyboard Nav
        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') {
                const inputs = Array.from(document.querySelectorAll('input'));
                const i = inputs.indexOf(e.target);
                const cols = ActiveConfigStructure.subjects.length + 2;
                if(e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); if(inputs[i+cols]) inputs[i+cols].focus(); }
                else if(e.key === 'ArrowUp') { e.preventDefault(); if(inputs[i-cols]) inputs[i-cols].focus(); }
            }
        });
    </script>
</body>
</html>
