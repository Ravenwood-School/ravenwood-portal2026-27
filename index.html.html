<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenwood Results Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        .missing-mark { background-color: #fee2e2 !important; border: 2px solid #ef4444 !important; }
        table { border-collapse: collapse; width: 100%; min-width: 1000px; }
        th, td { border: 1px solid #d1d5db; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #f3f4f6; color: #1f2937; font-weight: 600; }
        input { width: 100%; text-align: center; background: transparent; border: none; padding: 6px; font-weight: 500; }
        input:focus { outline: 2px solid #3b82f6; background: #fff; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-950 text-white p-4 shadow-lg flex justify-between items-center px-8">
        <div class="flex items-center gap-4">
            <img id="display-logo" src="https://via.placeholder.com/60" alt="Logo" class="h-14 w-14 rounded-full object-cover bg-white p-1 border">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">RAVENWOOD INTERNATIONAL SCHOOL</h1>
                <p class="text-xs text-indigo-200 tracking-wider">Academic Session 2026-27</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="connection-status" class="px-3 py-1.5 rounded-full text-xs font-bold shadow-sm bg-yellow-100 text-yellow-700 border border-yellow-300">
                ⏳ Checking Connection...
            </div>
            <button id="logout-btn" class="hidden bg-rose-600 hover:bg-rose-700 px-5 py-2 rounded-lg text-sm font-bold transition shadow" onclick="logout()">Logout</button>
        </div>
    </header>

    <main id="login-section" class="flex-grow flex justify-center items-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <h2 class="text-2xl font-bold mb-6 text-center text-slate-800 border-b pb-3">Portal Login</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-2 text-slate-600">Select Role:</label>
                <select id="role-select" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-500" onchange="toggleLoginFields()">
                    <option value="teacher">Teacher / Data Entry</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div id="teacher-fields" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Class:</label>
                    <select id="class-select" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-500" onchange="updateSectionsDropdown()">
                        <option value="">-- Select Class --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Section:</label>
                    <select id="section-select" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-500">
                        <option value="">-- Select Section --</option>
                    </select>
                </div>
            </div>

            <div id="admin-fields" class="hidden mb-4">
                <label class="block text-sm font-semibold mb-1 text-slate-600">Admin Password:</label>
                <input type="password" id="admin-pass" placeholder="Enter Password (1234)" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-50 text-left focus:outline-none focus:border-indigo-500">
            </div>

            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg mt-6 transition shadow-md">Enter Dashboard</button>
        </div>
    </main>

    <main id="dashboard-section" class="hidden flex-grow p-6 max-w-[95%] mx-auto w-full space-y-6">
        
        <div id="admin-controls" class="hidden bg-white p-6 rounded-2xl shadow border border-slate-100 space-y-4">
            <h3 class="font-bold text-lg text-indigo-950 border-b pb-2 flex items-center gap-2">⚙️ Admin Configuration</h3>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-end">
                <div class="lg:col-span-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Excel Heading Template:</label>
                    <input type="text" id="excel-heading-input" value="PT 1 Exam Result of Class _________ for Academic Session 2026-27 (May)" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <button class="w-full bg-emerald-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition shadow" onclick="alert('Export all feature ready for integration')">Export All Classes</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow border border-slate-100 overflow-hidden">
            <div class="bg-slate-50 p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 id="current-view-title" class="text-xl font-bold text-slate-800">Class Workspace</h2>
                    <p class="text-xs text-slate-500 mt-0.5" id="sync-status">🟢 System Ready - Realtime Sync</p>
                </div>
                <div class="flex gap-3">
                    <button class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition flex items-center gap-2 shadow" onclick="addNewStudentRow()">
                        <span class="text-lg leading-none">+</span> Add Student Row
                    </button>
                    <button class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-emerald-700 transition flex items-center gap-2 shadow" onclick="exportCurrentClassToExcel()">
                        <span>📥</span> Export Print Excel
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto w-full p-4">
                <table id="marks-entry-table">
                    <thead id="table-head-row"></thead>
                    <tbody id="table-body-rows"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // ========================================================
        // 🔥 YOUR PERFECTLY CONFIGURED FIREBASE SETTINGS 🔥
        // ========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB5RV8tLsLZD6h1tsm_PxWnxrRZyylQY3k",
            authDomain: "ravenwood-exam-portal.firebaseapp.com",
            databaseURL: "https://ravenwood-exam-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ravenwood-exam-portal",
            storageBucket: "ravenwood-exam-portal.firebasestorage.app",
            messagingSenderId: "737654590264",
            appId: "1:737654590264:web:00b64a74917a93cd1b4fcd"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Database Connection Tracker
        const connectedRef = database.ref(".info/connected");
        connectedRef.on("value", (snap) => {
            const statusEl = document.getElementById('connection-status');
            if (snap.val() === true) {
                statusEl.className = "px-4 py-1.5 rounded-full text-xs font-bold shadow-sm bg-emerald-100 text-emerald-700 border border-emerald-300";
                statusEl.innerText = "🟢 Database Connected";
            } else {
                statusEl.className = "px-4 py-1.5 rounded-full text-xs font-bold shadow-sm bg-rose-100 text-rose-700 border border-rose-300";
                statusEl.innerText = "🔴 Disconnected! Check URL/Rules";
            }
        });

        const academicStructure = {
            "I": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["DAFFODILS", "DAISY", "ORCHID", "TULIP"] },
            "II": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["EARTH", "JUPITER", "MARS", "NEPTUNE", "VENUS"] },
            "III": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["AMAZON", "BEAS", "INDUS", "NILE", "THAMES"] },
            "IV": { subjects: ["English", "Hindi", "Punjabi", "Maths", "EVS", "ICT", "Art"], max: 20, sections: ["ARCTIC", "ATLANTIC", "PACIFIC"] },
            "V": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["MT. ALPS", "MT. BLANC", "MT. ELBERT", "MT. EVEREST"] },
            "VI": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["DARWIN", "EINSTEIN", "NEWTON"] },
            "VII": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["DIAMOND", "EMERALD", "PEARL"] },
            "VIII": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["FLAMINGO", "HORNBILL", "JAY"] },
            "IX": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 20, sections: ["LEONARDO", "PICASSO", "SALVADOR"] },
            "X": { subjects: ["English", "Hindi", "Punjabi", "Maths", "Science", "SST", "ICT", "Art"], max: 40, sections: ["WORDSWORTH"] }
        };

        let ActiveUserRole = "teacher";
        let SelectedClassKey = "";
        let SelectedSectionKey = "";
        let DatabaseReferencePath = "";
        let ActiveConfigStructure = null;

        window.onload = () => {
            const classDropdown = document.getElementById('class-select');
            Object.keys(academicStructure).forEach(cls => {
                let opt = document.createElement('option');
                opt.value = cls;
                opt.innerText = `Class ${cls}`;
                classDropdown.appendChild(opt);
            });
        };

        function toggleLoginFields() {
            const role = document.getElementById('role-select').value;
            if(role === 'admin') {
                document.getElementById('teacher-fields').classList.add('hidden');
                document.getElementById('admin-fields').classList.remove('hidden');
            } else {
                document.getElementById('admin-fields').classList.add('hidden');
                document.getElementById('teacher-fields').classList.remove('hidden');
            }
        }

        function updateSectionsDropdown() {
            const cls = document.getElementById('class-select').value;
            const secDropdown = document.getElementById('section-select');
            secDropdown.innerHTML = '<option value="">-- Select Section --</option>';
            if(cls && academicStructure[cls]) {
                academicStructure[cls].sections.forEach(sec => {
                    let opt = document.createElement('option');
                    opt.value = sec;
                    opt.innerText = sec;
                    secDropdown.appendChild(opt);
                });
            }
        }

        function login() {
            const role = document.getElementById('role-select').value;
            if(role === 'admin') {
                if(document.getElementById('admin-pass').value === '1234') {
                    ActiveUserRole = 'admin';
                    document.getElementById('admin-controls').classList.remove('hidden');
                    InitializeWorkspace('I', 'DAFFODILS');
                } else {
                    alert('Invalid Password!'); return;
                }
            } else {
                const cls = document.getElementById('class-select').value;
                const sec = document.getElementById('section-select').value;
                if(!cls || !sec) { alert('Please choose Class and Section.'); return; }
                ActiveUserRole = 'teacher';
                document.getElementById('admin-controls').classList.add('hidden');
                InitializeWorkspace(cls, sec);
            }
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
        }

        function logout() { location.reload(); }

        function InitializeWorkspace(cls, sec) {
            SelectedClassKey = cls;
            SelectedSectionKey = sec;
            ActiveConfigStructure = academicStructure[cls];
            DatabaseReferencePath = `student_records/${cls}/${sec}`;
            document.getElementById('current-view-title').innerText = `Class Workspace: ${cls} - ${sec}`;
            
            GenerateTableHeaders();
            SyncCloudDataLive();
        }

        function GenerateTableHeaders() {
            const thead = document.getElementById('table-head-row');
            let html = `<tr>
                <th style="width: 80px;">Roll No</th>
                <th style="width: 250px; text-align: left;">Student Name</th>`;
                
            ActiveConfigStructure.subjects.forEach(sub => {
                let isArt = sub.toLowerCase() === 'art';
                let label = isArt ? 'Grade' : `Max: ${ActiveConfigStructure.max}`;
                html += `<th>${sub} <br><span class="text-[10px] text-slate-500 font-normal">(${label})</span></th>`;
            });

            html += `
                <th class="bg-indigo-100 text-indigo-900 border-indigo-200">Total</th>
                <th class="bg-indigo-100 text-indigo-900 border-indigo-200">%age</th>
                <th class="bg-amber-100 text-amber-900 border-amber-200">Rank</th>`;
                
            if(ActiveUserRole === 'admin') html += `<th class="bg-rose-100 text-rose-700">Actions</th>`;
            html += `</tr>`;
            thead.innerHTML = html;
        }

        function SyncCloudDataLive() {
            database.ref(DatabaseReferencePath).off();
            database.ref(DatabaseReferencePath).on('value', (snapshot) => {
                const records = snapshot.val() || {};
                RenderDataMatrix(records);
            }, (error) => {
                console.error("Firebase Auth Error: ", error);
                alert("Firebase Error: Connection refused. Please check if Database URL is correct and Rules are set to true.");
            });
        }

        function RenderDataMatrix(records) {
            const tbody = document.getElementById('table-body-rows');
            tbody.innerHTML = '';
            
            let studentsList = Object.keys(records).map(id => ({ id: id, ...records[id] }));
            
            studentsList.forEach(student => {
                let sum = 0;
                ActiveConfigStructure.subjects.forEach(sub => {
                    if(sub.toLowerCase() !== 'art' && student[sub]) {
                        sum += Number(student[sub]);
                    }
                });
                student.calculatedTotal = sum;
            });

            studentsList.sort((a, b) => b.calculatedTotal - a.calculatedTotal);

            studentsList.forEach((student, index) => {
                const tr = document.createElement('tr');
                
                let rollClass = (!student.rollNo) ? 'missing-mark' : '';
                let nameClass = (!student.name) ? 'missing-mark' : '';
                
                let rowHtml = `
                    <td class="${rollClass}"><input type="number" placeholder="Roll" value="${student.rollNo || ''}" onblur="commitCellChange('${student.id}', 'rollNo', this.value)" oninput="evaluateHighlight(this)"></td>
                    <td class="${nameClass}"><input type="text" placeholder="Enter Name" style="text-align: left;" value="${student.name || ''}" onblur="commitCellChange('${student.id}', 'name', this.value)" oninput="evaluateHighlight(this)"></td>
                `;

                ActiveConfigStructure.subjects.forEach(sub => {
                    let markVal = student[sub] !== undefined ? student[sub] : '';
                    let subClass = (markVal === '') ? 'missing-mark' : '';
                    let inpType = (sub.toLowerCase() === 'art') ? 'text' : 'number';
                    
                    rowHtml += `<td class="${subClass}"><input type="${inpType}" placeholder="-" value="${markVal}" oninput="evaluateHighlight(this); validateMaxConstraint(this, '${sub}')" onblur="commitCellChange('${student.id}', '${sub}', this.value)"></td>`;
                });

                const academicSubjects = ActiveConfigStructure.subjects.filter(s => s.toLowerCase() !== 'art').length;
                const grandTotal = academicSubjects * ActiveConfigStructure.max;
                const percentage = grandTotal > 0 ? ((student.calculatedTotal / grandTotal) * 100).toFixed(1) + '%' : '0.0%';

                rowHtml += `
                    <td class="bg-indigo-50 font-bold text-indigo-900 border-indigo-200">${student.calculatedTotal}</td>
                    <td class="bg-indigo-50 font-bold text-indigo-900 border-indigo-200">${percentage}</td>
                    <td class="bg-amber-50 font-black text-amber-700 border-amber-200">${student.calculatedTotal > 0 ? index + 1 : '-'}</td>
                `;

                if(ActiveUserRole === 'admin') {
                    rowHtml += `<td><button class="text-rose-600 font-bold text-xs bg-rose-50 px-2 py-1 rounded border border-rose-200 hover:bg-rose-100" onclick="purgeRecord('${student.id}')">Delete</button></td>`;
                }

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function evaluateHighlight(el) {
            if(el.value.trim() === "") el.parentElement.classList.add('missing-mark');
            else el.parentElement.classList.remove('missing-mark');
        }

        function validateMaxConstraint(el, sub) {
            if(sub.toLowerCase() !== 'art' && Number(el.value) > ActiveConfigStructure.max) {
                alert(`Max limit is ${ActiveConfigStructure.max} for ${sub}!`);
                el.value = ActiveConfigStructure.max;
            }
        }

        function commitCellChange(id, field, val) {
            database.ref(`${DatabaseReferencePath}/${id}/${field}`).set(val).catch(e => alert("Save failed! Network issue."));
        }

        function addNewStudentRow() {
            try {
                const rowRef = database.ref(DatabaseReferencePath).push();
                let payload = { rollNo: "", name: "" };
                ActiveConfigStructure.subjects.forEach(sub => { payload[sub] = ""; });
                rowRef.set(payload).catch(e => alert("Could not create row! Check Firebase Rules (must be true)"));
            } catch(error) {
                alert("System error. Refresh the page.");
            }
        }

        function purgeRecord(id) {
            if(confirm("Delete this student permanently?")) {
                database.ref(`${DatabaseReferencePath}/${id}`).remove();
            }
        }

        function exportCurrentClassToExcel() {
            const template = document.getElementById('excel-heading-input').value;
            const finalHeading = template.replace('_________', `Class ${SelectedClassKey}-${SelectedSectionKey}`);
            
            const wbData = [ ["RAVENWOOD INTERNATIONAL SCHOOL"], [finalHeading], [] ];
            
            const table = document.getElementById('marks-entry-table');
            const headers = Array.from(table.querySelectorAll("th")).map(th => th.innerText.split('\n')[0].trim());
            if(ActiveUserRole === 'admin') headers.pop(); 
            wbData.push(headers);

            const rows = Array.from(table.querySelectorAll("tbody tr"));
            rows.forEach(row => {
                const rowData = [];
                row.querySelectorAll("input").forEach(inp => rowData.push(inp.value));
                const tds = row.querySelectorAll("td");
                let offset = (ActiveUserRole === 'admin') ? 1 : 0;
                rowData.push(tds[tds.length - 3 - offset].innerText);
                rowData.push(tds[tds.length - 2 - offset].innerText);
                rowData.push(tds[tds.length - 1 - offset].innerText);
                wbData.push(rowData);
            });

            const ws = XLSX.utils.aoa_to_sheet(wbData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Result");
            XLSX.writeFile(wb, `Class_${SelectedClassKey}_${SelectedSectionKey}_Result.xlsx`);
        }
    </script>
</body>
</html>
